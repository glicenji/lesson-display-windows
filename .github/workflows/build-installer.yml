name: Build Windows Installer

# Builds ClassSync.Server and ClassSync.Kiosk as self-contained
# win-x64 executables (so nobody installing them needs .NET separately),
# then packages both into one Windows installer with Inno Setup. Nothing
# needs to be installed by hand to use this — push to GitHub and download
# the finished installer from this run's "Artifacts" section.

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish server
        run: >
          dotnet publish src/LessonDisplay.Server/LessonDisplay.Server.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish/Server

      - name: Publish kiosk
        run: >
          dotnet publish src/LessonDisplay.Kiosk/LessonDisplay.Kiosk.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish/Kiosk

      - name: Publish LicenseTool (for you, the seller — not part of the installer)
        run: >
          dotnet publish tools/LicenseTool/LicenseTool.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish/LicenseTool

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\LessonDisplaySetup.iss
        shell: pwsh

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ClassSyncSetup
          path: installer/Output/ClassSyncSetup.exe

      - name: Upload LicenseTool
        uses: actions/upload-artifact@v4
        with:
          name: LicenseTool
          path: publish/LicenseTool/LicenseTool.exe
